services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.db
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.backend
    secrets:
      - postgres_password
      - secret_key
      - encryption_key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - encryption_key:/app/app

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  encryption_key:
    file: ./secrets/encryption_key.txt

volumes:
  pgdata:
  encryption_key:
