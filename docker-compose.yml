services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.db
    # No exposed ports — PostgreSQL is only accessible within the Docker
    # network by the backend container. Do NOT map this port externally.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - encryption_key:/app/app

volumes:
  pgdata:
  encryption_key:
